name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit, component and API tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1

  e2e:
    name: End-to-end, responsive and accessibility
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run end-to-end suite
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the pipeline on a high or critical advisory. Moderate and below
      # are reported but do not block, so a transitive dev-only advisory cannot
      # stop a release on its own.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check no secrets were committed
        run: |
          if git grep -nE "(sk-[A-Za-z0-9]{20,}|ANTHROPIC_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]]+|OPENAI_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]]+)" -- . ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo "::error::Possible secret committed to the repository"
            exit 1
          fi
          echo "No secrets found."
